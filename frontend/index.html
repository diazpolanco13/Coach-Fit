<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coach Fit</title>
    <!--
      Fondo de arranque. La intro de React no puede pintarse hasta que llega y
      se evalúa el bundle, así que hasta entonces se veía el blanco del
      navegador: la pantalla de carga aparecía DESPUÉS del destello en blanco,
      justo al revés de para lo que está.

      Va embebido a propósito —nada de hoja externa— para entrar en el primer
      paint, con el HTML. Incluye el fondo, el logo y el texto esenciales: así
      la espera empieza mostrando la identidad de la app, no una pantalla
      vacía. `SplashIntro` monta la misma composición encima.

      Los colores son los de `.splash-root` en `index.css`. Están en dos sitios
      porque uno tiene que vivir fuera del bundle; si cambian allí, cambiarlos
      aquí.
    -->
    <style>
      #boot {
        --boot-brand: oklch(0.74 0.17 44);
        --boot-glow: oklch(0.83 0.14 62);
        --boot-core: oklch(0.64 0.19 42);
        --boot-ink: oklch(0.97 0.015 60);
        position: fixed;
        inset: 0;
        z-index: 998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(
          ellipse at center,
          oklch(0.2 0.045 45) 0%,
          oklch(0.13 0.018 42) 68%
        );
      }
      #boot::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.05;
        background-image:
          linear-gradient(var(--boot-brand) 1px, transparent 1px),
          linear-gradient(90deg, var(--boot-brand) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      #boot .boot-logo {
        position: relative;
        z-index: 1;
        display: flex;
        width: 10rem;
        height: 10rem;
        margin-bottom: 2rem;
        align-items: center;
        justify-content: center;
      }
      #boot .boot-ring {
        position: absolute;
        border: 1px solid color-mix(in oklab, var(--boot-brand) 28%, transparent);
        border-radius: 9999px;
      }
      #boot .boot-ring:nth-child(1) {
        inset: 0;
        animation: boot-spin 20s linear infinite;
      }
      #boot .boot-ring:nth-child(2) {
        inset: 18px;
        border-color: color-mix(in oklab, var(--boot-glow) 22%, transparent);
        animation: boot-spin-back 12s linear infinite;
      }
      #boot .boot-ring:nth-child(3) {
        inset: 38px;
        border-color: color-mix(in oklab, var(--boot-brand) 32%, transparent);
        animation: boot-spin 7s linear infinite;
      }
      #boot .boot-ring::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: var(--boot-brand);
        box-shadow: 0 0 12px var(--boot-brand);
        transform: translate(-50%, -50%);
      }
      #boot .boot-ring:nth-child(2)::before {
        top: 50%;
        right: 0;
        left: auto;
        width: 6px;
        height: 6px;
        background: var(--boot-glow);
        box-shadow: 0 0 10px var(--boot-glow);
        transform: translate(50%, -50%);
      }
      #boot .boot-ring:nth-child(3)::before {
        left: 25%;
        width: 6px;
        height: 6px;
        box-shadow: 0 0 8px var(--boot-brand);
        transform: translateY(-50%);
      }
      #boot .boot-core {
        position: relative;
        z-index: 1;
        display: flex;
        width: 3.5rem;
        height: 3.5rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        color: var(--boot-ink);
        background: var(--boot-core);
        box-shadow:
          0 0 26px color-mix(in oklab, var(--boot-brand) 40%, transparent),
          inset 0 0 12px oklch(0 0 0 / 25%);
      }
      #boot .boot-core svg {
        width: 2.125rem;
        height: 2.125rem;
      }
      #boot h1 {
        position: relative;
        z-index: 1;
        margin: 0 0 0.75rem;
        padding-left: 0.35em;
        color: var(--boot-ink);
        font: 700 clamp(1.5rem, 7vw, 2.25rem) ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.35em;
        text-shadow: 0 0 30px color-mix(in oklab, var(--boot-brand) 45%, transparent);
      }
      #boot p {
        position: relative;
        z-index: 1;
        margin: 0 0 2rem;
        color: var(--boot-brand);
        font: 400 clamp(9px, 2.6vw, 11px) ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.3em;
        white-space: nowrap;
      }
      #boot .boot-track {
        position: relative;
        z-index: 1;
        width: min(20rem, 78vw);
        height: 2px;
        overflow: hidden;
        border-radius: 9999px;
        background: color-mix(in oklab, var(--boot-brand) 14%, transparent);
      }
      #boot .boot-track::after {
        content: '';
        position: absolute;
        inset-block: 0;
        left: 0;
        width: 35%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--boot-brand), var(--boot-glow));
        box-shadow: 0 0 12px color-mix(in oklab, var(--boot-brand) 45%, transparent);
        animation: boot-progress 1.1s ease-in-out infinite alternate;
      }
      #boot .boot-corner {
        position: absolute;
        width: 2rem;
        height: 2rem;
        border: 0 solid var(--boot-brand);
        opacity: 0.35;
      }
      #boot .boot-tl { top: 10px; left: 10px; border-top-width: 2px; border-left-width: 2px; }
      #boot .boot-tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; }
      #boot .boot-bl { bottom: 10px; left: 10px; border-bottom-width: 2px; border-left-width: 2px; }
      #boot .boot-br { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-spin-back { to { transform: rotate(-360deg); } }
      @keyframes boot-progress {
        from { transform: translateX(-100%); }
        to { transform: translateX(285%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Cargando Coach Fit">
      <div class="boot-logo" aria-hidden="true">
        <i class="boot-ring"></i>
        <i class="boot-ring"></i>
        <i class="boot-ring"></i>
        <div class="boot-core">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"></path>
            <path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"></path>
            <path d="m9.6 14.4 4.8-4.8"></path>
            <path d="m2.5 21.5 1.4-1.4"></path>
            <path d="m20.1 3.9 1.4-1.4"></path>
          </svg>
        </div>
      </div>
      <h1>COACH FIT</h1>
      <p>FUERZA · CARDIO · PROGRESO</p>
      <div class="boot-track" aria-hidden="true"></div>
      <i class="boot-corner boot-tl" aria-hidden="true"></i>
      <i class="boot-corner boot-tr" aria-hidden="true"></i>
      <i class="boot-corner boot-bl" aria-hidden="true"></i>
      <i class="boot-corner boot-br" aria-hidden="true"></i>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
